<!doctype html><meta charset="utf-8"><title>Site policy fixture</title>
<style>body{font:18px system-ui;background:white;color:#181818;padding:24px} @media(prefers-color-scheme:dark){body{background:#181818;color:white}} .brk-advertisement,[data-cookie-banner]{padding:18px;background:#ffc;color:black;margin:12px 0}</style>
<style id="brk-site-policy">:root{--fixture-owned:keep}</style><h1>Website policy fixture</h1><p id="normal">Normal content stays visible.</p><div id="sponsor">Fixture sponsor for rule updates</div>
<div class="brk-advertisement" id="ad">Fixture advertisement</div><div data-cookie-banner id="banner">Fixture cookie banner. No consent is sent.</div>
<button onclick="Notification.requestPermission().then(x=>document.title='permission:'+x)">Request notifications</button>
<button onclick="navigator.geolocation.getCurrentPosition(x=>document.title='location:allowed',x=>document.title='location:'+x.code)">Request location</button>
<input id="input" placeholder="Input remains editable"><script>
window.ticks=0;setInterval(()=>ticks++,100);
window.reportPolicy=()=>document.title='policy:'+JSON.stringify({pageStyle:getComputedStyle(document.documentElement).getPropertyValue('--fixture-owned').trim(),dark:matchMedia('(prefers-color-scheme:dark)').matches,css:getComputedStyle(document.documentElement).getPropertyValue('--brk-space-color').trim(),ad:getComputedStyle(document.getElementById('ad')).display,banner:getComputedStyle(document.getElementById('banner')).display,normal:getComputedStyle(document.getElementById('normal')).display});
window.seedSite=async function(value){document.cookie='sitefixture='+value+';path=/;max-age=3600';document.cookie='pathfixture='+value+';path=/nested;max-age=3600';localStorage.setItem('sitefixture',value);const db=await new Promise((resolve,reject)=>{let r=indexedDB.open('sitefixture',1);r.onupgradeneeded=()=>r.result.createObjectStore('values');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});await new Promise(resolve=>{const t=db.transaction('values','readwrite');t.objectStore('values').put(value,'key');t.oncomplete=resolve});db.close();await caches.open('sitefixture').then(x=>x.put('/fixture',new Response(value)));await fetch('/site-policy-cookie-seed?value='+encodeURIComponent(value),{cache:'no-store'});await navigator.serviceWorker.register('/site-policy-worker.js',{scope:'/site-policy-worker-scope/'});document.title='seed:'+value};
window.readSite=async function(){const databases=await indexedDB.databases();const server=await fetch('/site-policy-cookie-read',{cache:'no-store'}).then(x=>x.json());const workers=await navigator.serviceWorker.getRegistrations();document.title='storage:'+JSON.stringify({serverCookie:server.cookie,worker:workers.some(x=>x.scope.includes('/site-policy-worker-scope/')),cookie:document.cookie,local:localStorage.getItem('sitefixture'),idb:databases.some(x=>x.name==='sitefixture'),cache:(await caches.keys()).includes('sitefixture')})};
</script>
