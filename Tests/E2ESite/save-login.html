<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>login</title>
<style>
  body { margin: 0; }
  input { position: absolute; left: 40px; width: 300px; height: 36px; box-sizing: border-box; font: 18px -apple-system, sans-serif; }
  #username { top: 40px; }
  #password { top: 90px; }
</style>
</head>
<body>
<!-- Save-password fixture (Password-SaveCard): submitting makes Chromium offer to save the login; once saved, Chromium
     fills it when the page loads again. A page script can read filled values only after a real user gesture, so a
     click reports them in the title. -->
<!-- Sent to another page: Chromium takes the same form shown again for a failed login and offers nothing. -->
<form action="save-login-done.html" method="get">
  <input id="username" name="username" type="text" autocomplete="username">
  <input id="password" name="password" type="password" autocomplete="current-password">
  <!-- Return submits a form of two fields only through a submit button. -->
  <button id="submit" type="submit" style="position: absolute; left: 40px; top: 140px;">Sign in</button>
</form>
<script>
  document.addEventListener("click", () => setTimeout(() => {
    const user = document.getElementById("username").value, pass = document.getElementById("password").value;
    document.title = "login:" + user + ":" + (pass === "fixture-pass-123" ? "filled" : (pass ? "other" : "empty"));
  }, 100));
</script>
</body>
</html>
