<script>
// PageReal-Menus and PageReal-Keys. `marker` tells a page that stayed from one that reloaded; ?guard=1 asks before
// leaving or reloading, as a page with unsaved work does.
var marker = 'fresh';
if (new URLSearchParams(location.search).get('guard') === '1') {
  window.addEventListener('beforeunload', function (e) { e.preventDefault(); e.returnValue = ''; });
}
</script>
