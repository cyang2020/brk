<!doctype html><meta charset="utf-8"><title>Capture fixture</title>
<style>*{box-sizing:border-box}body{margin:0;background:#d02030;font:24px system-ui}.band{height:1000px;padding:70px 40px}header{position:sticky;top:0;height:50px;background:#ffcc00}canvas{width:160px;height:90px}video{width:160px;height:90px}button{font:20px system-ui}</style>
<header>Sticky capture header</header><section class="band">Red band • Capture fixture<br><canvas id="c" width="160" height="90"></canvas><canvas id="gpu" width="160" height="90"></canvas><video id="v" muted playsinline></video><button onclick="v.play()">Play</button><button onclick="v.pause()">Pause</button></section><section class="band" style="background:#20b050">Green band</section><section class="band" style="background:#2040d0">Blue band</section>
<script>const x=c.getContext('2d');setInterval(()=>{x.fillStyle='#8040e0';x.fillRect(0,0,160,90);x.fillStyle='white';x.fillText('GPU canvas',10,30)},50);const gl=gpu.getContext('webgl2',{preserveDrawingBuffer:true})||gpu.getContext('webgl',{preserveDrawingBuffer:true});if(gl){gl.clearColor(17/255,136/255,238/255,1);gl.clear(gl.COLOR_BUFFER_BIT)}v.srcObject=c.captureStream(20);v.play().catch(()=>{});</script>
