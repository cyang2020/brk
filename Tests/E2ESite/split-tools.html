<!doctype html>
<meta charset="utf-8">
<title>Split editor ready</title>
<style>
  body { margin: 28px; background: #fff; color: #172030; font: 16px system-ui; }
  input { position: absolute; left: 24px; top: 80px; height: 38px; box-sizing: border-box; width: calc(100% - 48px); padding: 8px; font: inherit; }
  h1 { font-size: 20px; }
</style>
<h1>Split pane editor</h1>
<input id="editor" aria-label="Pane text" placeholder="Type in this pane">
<p id="value">No text entered</p>
<script>
  editor.addEventListener('input', () => {
    value.textContent = editor.value;
    document.title = 'Split text:' + editor.value;
  });
</script>
