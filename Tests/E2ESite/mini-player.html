<!doctype html><meta charset="utf-8"><title>Mini player fixture</title>
<style>body{margin:0;font:16px system-ui}button{width:200px;height:100px}</style>
<button id="play" onclick="start()">Play</button><button id="pause" onclick="a.pause()">Pause</button><audio id="a" loop></audio>
<script>
'use strict';
// A looping quiet tone in an ordinary audio element, written here so that the site has no binary file.
const rate = 8000, seconds = 6, data = new Uint8Array(44 + rate * seconds), view = new DataView(data.buffer);
const text = (at, s) => { for (let i = 0; i < s.length; i++) data[at + i] = s.charCodeAt(i); };
text(0, 'RIFF'); view.setUint32(4, 36 + rate * seconds, true); text(8, 'WAVEfmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
view.setUint16(22, 1, true); view.setUint32(24, rate, true); view.setUint32(28, rate, true); view.setUint16(32, 1, true); view.setUint16(34, 8, true);
text(36, 'data'); view.setUint32(40, rate * seconds, true);
for (let i = 0; i < rate * seconds; i++) data[44 + i] = 128 + 6 * Math.sin(2 * Math.PI * 330 * i / rate);
const a = document.getElementById('a');
a.src = URL.createObjectURL(new Blob([data], {type: 'audio/wav'}));
function start() { a.play(); }
function report() { document.title = `paused=${a.paused} volume=${a.volume.toFixed(2)} next=${window.nextCount ?? 0} previous=${window.previousCount ?? 0}`; }
for (const event of ['play', 'pause', 'volumechange']) a.addEventListener(event, report);
if (new URLSearchParams(location.search).has('tracks')) {
  navigator.mediaSession.setActionHandler('nexttrack', () => { window.nextCount = (window.nextCount ?? 0) + 1; report(); });
  navigator.mediaSession.setActionHandler('previoustrack', () => { window.previousCount = (window.previousCount ?? 0) + 1; report(); });
}
</script>
