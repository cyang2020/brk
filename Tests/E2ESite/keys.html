<!doctype html>
<html><head><meta charset="utf-8"><title>keys</title></head>
<body><textarea id="t" autofocus></textarea>
<script>
// The title is the page's report to the e2e runner (N1, N2):
// - on load, "keys:loads=<n>", n counting loads of this tab (sessionStorage survives reloads), so two reloads show 3;
// - on every keydown, "key:<chord>:seen", chord in KeyChord order (ctrl, alt, shift, cmd, key), or ":swallowed" with
//   ?swallow=1, which also calls preventDefault so the page consumes the key.
var loads = Number(sessionStorage.getItem('loads') || '0') + 1;
sessionStorage.setItem('loads', String(loads));
document.title = 'keys:loads=' + loads;
var swallow = location.search.indexOf('swallow=1') >= 0;
window.addEventListener('keydown', function (e) {
  if (['Control', 'Alt', 'Shift', 'Meta'].indexOf(e.key) >= 0) return;
  var c = (e.ctrlKey ? 'ctrl+' : '') + (e.altKey ? 'alt+' : '') + (e.shiftKey ? 'shift+' : '') + (e.metaKey ? 'cmd+' : '') + e.key.toLowerCase();
  document.title = 'key:' + c + (swallow ? ':swallowed' : ':seen');
  if (swallow) e.preventDefault();
}, true);
</script></body></html>
