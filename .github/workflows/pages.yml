# The website, https://cyang2020.github.io/brk/, from site/ on every push to main that changes it.
# site/ holds the page, its stylesheet and small icons; the screenshots and recordings come from docs/media/, and
# only the files index.html names are copied, so nothing else in docs/media/ is published.
# Plain files, no build step. Repository settings: Pages, source "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/media/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

# One deployment at a time; a newer push waits instead of cancelling one already going out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble the site
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy the page and the media it names
        run: |
          set -euo pipefail
          mkdir -p _site/media
          cp -R site/. _site/
          grep -o 'media/[A-Za-z0-9._-]*' site/index.html | sort -u | while read -r file; do
            cp "docs/media/${file#media/}" "_site/$file"
          done
          ls -lR _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
