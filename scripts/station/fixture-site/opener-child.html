<!doctype html>
<html><head><meta charset="utf-8"><title>Child closes itself</title>
<style>body{font:20px -apple-system,sans-serif;margin:40px}</style></head>
<body><h1>Child closes itself</h1><p>This tab reports to its opener and closes in 3 seconds.</p>
<script>if(window.opener){window.opener.postMessage('signed-in','*')};setTimeout(()=>window.close(),3000);</script>
</body></html>
