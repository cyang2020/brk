<!doctype html>
<html><head><meta charset="utf-8"><title>Web Audio fixture</title>
<style>body{font:20px -apple-system,sans-serif;margin:40px}button{font:inherit;padding:18px 34px;margin-right:16px}</style></head>
<body>
<h1>Web Audio fixture</h1>
<p>A quiet tone from Web Audio, with no audio or video element on the page.</p>
<button id="play" onclick="start()">Play</button>
<script>
function start() {
  const context = new AudioContext(), oscillator = context.createOscillator(), gain = context.createGain();
  gain.gain.value = 0.02; oscillator.frequency.value = 330; oscillator.connect(gain).connect(context.destination); oscillator.start();
  document.title = 'Web Audio fixture (playing)';
}
</script>
</body></html>
