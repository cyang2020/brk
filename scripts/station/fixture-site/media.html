<!doctype html>
<html><head><meta charset="utf-8"><title>Media fixture</title>
<style>body{font:20px -apple-system,sans-serif;margin:40px}button{font:inherit;padding:18px 34px;margin-right:16px}</style></head>
<body>
<h1>Media fixture</h1>
<p>A quiet looping tone, for comparing how a tab shows that it is playing.</p>
<button id="play" onclick="document.getElementById('a').play();document.title='Media fixture (playing)'">Play</button>
<button id="pause" onclick="document.getElementById('a').pause();document.title='Media fixture (paused)'">Pause</button>
<p><audio id="a" loop controls src="tone.wav"></audio></p>
<script>
if ('mediaSession' in navigator) { navigator.mediaSession.metadata = new MediaMetadata({title: 'Fixture tone', artist: 'Brk fixture', album: 'Visual pairs'}); }
</script>
</body></html>
